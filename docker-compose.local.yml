# Override: build ARTEX from this fork's source instead of pulling tomicdd/artex.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  artex:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: artex-tr:local
    environment:
      # Language of outgoing notifications (en | tr). UI language is chosen in the app.
      ARTEX_LANG: ${ARTEX_LANG:-en}
